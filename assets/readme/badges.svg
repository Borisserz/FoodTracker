    </a>
    <rect x="180" y="12" width="118" height="48" rx="24" fill="#FFF8F2" stroke="#E8D4C7"/>
    <text x="239" y="42" text-anchor="middle" fill="#5C433A" font-size="15" font-weight="650">iOS 17+</text>
    <rect x="310" y="12" width="118" height="48" rx="24" fill="#FFF8F2" stroke="#E8D4C7"/>
    <text x="369" y="42" text-anchor="middle" fill="#5C433A" font-size="15" font-weight="650">SwiftUI</text>
    <rect x="440" y="12" width="128" height="48" rx="24" fill="#FFF8F2" stroke="#E8D4C7"/>
    <text x="504" y="42" text-anchor="middle" fill="#5C433A" font-size="15" font-weight="650">SwiftData</text>
    <rect x="580" y="12" width="128" height="48" rx="24" fill="#FFF8F2" stroke="#E8D4C7"/>
    <text x="644" y="42" text-anchor="middle" fill="#5C433A" font-size="15" font-weight="650">HealthKit</text>
    <rect x="720" y="12" width="118" height="48" rx="24" fill="#FFF8F2" stroke="#E8D4C7"/>
    <text x="779" y="42" text-anchor="middle" fill="#5C433A" font-size="15" font-weight="650">Gemini</text>
    <rect x="850" y="12" width="118" height="48" rx="24" fill="#FFF8F2" stroke="#E8D4C7"/>
    <text x="909" y="42" text-anchor="middle" fill="#5C433A" font-size="15" font-weight="650">VisionKit</text>
