<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="72" viewBox="0 0 1200 72" role="img" aria-labelledby="title desc">
  <title id="title">FoodTracker badges</title>
  <desc id="desc">Platform and stack badges for FoodTracker.</desc>
  <defs>
    <linearGradient id="store" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F28A4B"/>
      <stop offset="100%" stop-color="#E4576B"/>
    </linearGradient>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <a href="https://apps.apple.com/us/app/foodtracker-ai-macro-tracker/id6778506345">
