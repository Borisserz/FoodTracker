<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">FoodTracker</title>
  <desc id="desc">Native iOS nutrition app with AI meal scanning, macro tracking, and HealthKit sync with WorkoutTracker.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8F2EB"/>
      <stop offset="55%" stop-color="#F3E8DF"/>
      <stop offset="100%" stop-color="#EDE2D7"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F28A4B"/>
      <stop offset="100%" stop-color="#E4576B"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFCFA"/>
      <stop offset="100%" stop-color="#F7EEE6"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#C9A891" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="357" rx="26.5" fill="none" stroke="#E2D3C5" stroke-width="1.5"/>

  <g transform="translate(56 48)">
    <text x="0" y="18" fill="#B07A6A" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="600" letter-spacing="2.4">IOS  |  NUTRITION  |  HEALTHKIT</text>
    <text x="0" y="78" fill="#2B211C" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="54" font-weight="750">FoodTracker</text>
    <text x="0" y="124" fill="#6C564C" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="500">AI macro tracker that scans meals,</text>
    <text x="0" y="156" fill="#6C564C" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="500">menus, and barcodes in one flow.</text>

    <g transform="translate(0 196)">
      <rect width="118" height="36" rx="18" fill="#FFF8F2" stroke="#E8D4C7"/>
      <text x="59" y="24" text-anchor="middle" fill="#5C433A" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="650">Gemini</text>
      <rect x="128" width="118" height="36" rx="18" fill="#FFF8F2" stroke="#E8D4C7"/>
      <text x="187" y="24" text-anchor="middle" fill="#5C433A" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="650">VisionKit</text>
      <rect x="256" width="118" height="36" rx="18" fill="#FFF8F2" stroke="#E8D4C7"/>
      <text x="315" y="24" text-anchor="middle" fill="#5C433A" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="650">SwiftData</text>
      <rect x="384" width="110" height="36" rx="18" fill="#FFF8F2" stroke="#E8D4C7"/>
      <text x="439" y="24" text-anchor="middle" fill="#5C433A" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="650">HealthKit</text>
    </g>
  </g>

  <g transform="translate(760 40)" filter="url(#soft)">
    <rect width="384" height="280" rx="24" fill="url(#panel)" stroke="#E5D3C5" stroke-width="1.5"/>

    <text x="24" y="36" fill="#B07A6A" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="650" letter-spacing="1.6">DAILY ENERGY</text>
    <text x="24" y="72" fill="#2B211C" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="700">608 / 2 262 kcal</text>

    <!-- ring centered, clear of bottom chips -->
    <g transform="translate(192 156)">
      <circle r="70" fill="none" stroke="#F0E2D6" stroke-width="16"/>
      <circle r="70" fill="none" stroke="url(#ring)" stroke-width="16" stroke-linecap="round" stroke-dasharray="110 330" transform="rotate(-90)"/>
      <text x="0" y="-2" text-anchor="middle" fill="#2B211C" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="750">27%</text>
      <text x="0" y="22" text-anchor="middle" fill="#8A6C60" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="600">eaten</text>
    </g>

    <g transform="translate(24 232)">
      <rect width="104" height="28" rx="14" fill="#F7E7DC"/>
      <circle cx="18" cy="14" r="5" fill="#E4576B"/>
      <text x="62" y="19" text-anchor="middle" fill="#8A4A3D" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="650">Protein</text>
      <rect x="114" width="86" height="28" rx="14" fill="#F7E7DC"/>
      <circle cx="130" cy="14" r="5" fill="#F28A4B"/>
      <text x="164" y="19" text-anchor="middle" fill="#8A4A3D" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="650">Fat</text>
      <rect x="210" width="100" height="28" rx="14" fill="#F7E7DC"/>
      <circle cx="226" cy="14" r="5" fill="#E8B14A"/>
      <text x="268" y="19" text-anchor="middle" fill="#8A4A3D" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="650">Carbs</text>
    </g>
  </g>
</svg>
